name: Website
on:
  pull_request:
    branches: [main]
    paths: ['website/**', 'README.md', 'ROADMAP.md', '.github/workflows/website.yml', '.github/workflows/deploy-website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'README.md', 'ROADMAP.md', '.github/workflows/website.yml', '.github/workflows/deploy-website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: website build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --shm-size=1g
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify generated site essentials
        run: |
          test -s dist/index.html
          test -s dist/quickstart/index.html
          test -s dist/capabilities/index.html
          test -s dist/404.html
          test -s dist/robots.txt
          test -s dist/llms.txt
          test -s dist/sitemap-index.xml
          grep -q 'https://intpot.modepot.io/' dist/index.html
          grep -q '<title>.*Intpot.*</title>' dist/index.html
