name: Changelog

on:
  pull_request:
    branches: [main]
    # Labels must trigger a new run so the maintainer-controlled exemption takes effect
    # without requiring an unrelated contributor push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read # Required to verify numeric fragments reference an issue.
  pull-requests: read # Required to inspect the pull request's changed files.

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Skip non-user-facing changes
        if: contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        run: echo "skip-changelog label present"
      - name: Require a changelog fragment from this pull request
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^changelog\.d/([0-9]+|\+[A-Za-z0-9][A-Za-z0-9._-]*)\.(added|changed|deprecated|removed|fixed)\.md$'
          mapfile -t fragments < <(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate --jq '.[] | select(.status != "removed") | .filename' \
              | grep -E "$pattern" || true
          )

          if (( ${#fragments[@]} == 0 )); then
            echo "::error::no changelog fragment found — add an issue-numbered or unique orphan fragment, or apply the skip-changelog label"
            exit 1
          fi

          for fragment in "${fragments[@]}"; do
            if [[ "$fragment" =~ ^changelog\.d/([0-9]+)\. ]]; then
              issue_number="${BASH_REMATCH[1]}"
              if ! kind="$(gh api "repos/${REPOSITORY}/issues/${issue_number}" \
                --jq 'if has("pull_request") then "pull-request" else "issue" end')"; then
                echo "::error::${fragment} does not reference an existing issue"
                exit 1
              fi
              if [[ "$kind" != "issue" ]]; then
                echo "::error::${fragment} must use an issue number, not a pull request number"
                exit 1
              fi
            fi
          done

          echo "${#fragments[@]} changelog fragment(s) validated in PR #${PR_NUMBER}"
