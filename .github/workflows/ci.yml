name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  schedule:
    # Floating dependencies run out of band so a new upstream release cannot
    # unexpectedly block an otherwise unrelated pull request.
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src/ tests/ examples/semantic_schema.py examples/definition_bindings.py examples/diagnostic_context.py scripts/verify_generated_examples.py scripts/verify_installed_artifacts.py
      - run: uv run ruff format --check src/ tests/ examples/semantic_schema.py examples/definition_bindings.py examples/diagnostic_context.py scripts/verify_generated_examples.py scripts/verify_installed_artifacts.py

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-extras --locked
      - run: uv run pyright src/ tests/ examples/semantic_schema.py examples/definition_bindings.py examples/diagnostic_context.py scripts/verify_generated_examples.py scripts/verify_installed_artifacts.py

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest tests/ -v
          --cov=src/intpot
          --cov-report=term-missing
          --cov-fail-under=80

  compatibility-oldest:
    name: oldest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typer 0.9.0
            editable: ".[mcp]"
            framework: "typer==0.9.0"
            package: typer
            version: "0.9.0"
            tests: tests/test_inspectors/test_cli_inspector.py tests/test_commands/test_cli_compatibility.py
          - name: FastAPI 0.100.0
            editable: ".[api]"
            framework: "fastapi==0.100.0"
            package: fastapi
            version: "0.100.0"
            tests: tests/test_inspectors/test_api_inspector.py
            consumers: api
          - name: FastMCP 2.0.0
            editable: ".[mcp]"
            framework: "fastmcp==2.0.0"
            # FastMCP 2.0 imports eval_type_backport, removed in Pydantic 2.11.
            constraint: "pydantic<2.11"
            package: fastmcp
            version: "2.0.0"
            tests: tests/test_inspectors/test_mcp_inspector.py
            consumers: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Exercise declared lower bound
        env:
          EDITABLE: ${{ matrix.editable }}
          FRAMEWORK: ${{ matrix.framework }}
          CONSTRAINT: ${{ matrix.constraint }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
          TESTS: ${{ matrix.tests }}
          CONSUMERS: ${{ matrix.consumers }}
        run: |
          run=(uv run --no-project --python 3.11 --with-editable "$EDITABLE" --with "$FRAMEWORK" --with pytest)
          if [[ "$CONSUMERS" == "api" ]]; then
            run+=(--with httpx --with 'httpx<0.28')
          elif [[ "$CONSUMERS" == "mcp" ]]; then
            run+=(--with "pydantic<2.11")
          fi
          if [[ -n "$CONSTRAINT" ]]; then
            run+=(--with "$CONSTRAINT")
          fi
          "${run[@]}" python -c 'from importlib.metadata import version; import os; actual = version(os.environ["PACKAGE"]); expected = os.environ["VERSION"]; assert actual == expected, (actual, expected)'
          read -r -a tests <<< "$TESTS"
          "${run[@]}" pytest "${tests[@]}" -q
          if [[ -n "$CONSUMERS" ]]; then
            consumer_tests=(tests/test_helper_recovery.py)
            case "$CONSUMERS" in
              api) target_filter='api and helper_and_constant' ;;
              mcp) target_filter='mcp and helper_and_constant' ;;
              *) echo "unsupported consumer target: $CONSUMERS" >&2; exit 2 ;;
            esac
            if [[ "$CONSUMERS" == "mcp" ]]; then
              run+=(--with "pydantic<2.11")
            fi
            "${run[@]}" pytest "${consumer_tests[@]}" -q -k "$target_filter"
          fi

  compatibility-fastmcp-2-latest:
    name: latest FastMCP 2.x
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Exercise latest FastMCP 2.x
        run: |
          run=(uv run --no-project --python 3.11 --with-editable '.[mcp]' --with 'fastmcp>=2,<3' --with pytest)
          "${run[@]}" python -c 'from importlib.metadata import version; actual = version("fastmcp"); assert actual.startswith("2."), actual'
          "${run[@]}" pytest tests/test_inspectors/test_mcp_inspector.py -q

  compatibility-latest:
    name: latest dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Exercise newest resolvable dependencies
        run: >-
          uv run --no-project --python 3.11 --with-editable '.[dev]'
          pytest tests/ -q

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - name: Exercise installed wheel and sdist consumers
        run: uv run --no-project --python 3.11 --with fastapi --with httpx --with fastmcp python scripts/verify_installed_artifacts.py
      # Packaging breaks are otherwise only discovered while cutting a release.
      - name: Verify distribution artifacts
        run: |
          python3 - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert "intpot/__init__.py" in names, names
              # Template data backs three different commands, and a wheel that
              # drops any of them still imports cleanly — the failure only shows
              # up when a user runs the command.
              for required, breaks in [
                  ("intpot/templates/cli_app.py.j2", "every generator"),
                  ("intpot/templates/scaffold/", "intpot init"),
                  ("intpot/templates/skills/", "intpot add skills"),
              ]:
                  assert any(n.startswith(required) for n in names), (
                      f"{required} missing from the wheel — {breaks} would fail"
                  )

          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              assert any(n.endswith("/src/intpot/__init__.py") for n in names), names

          print(f"verified {wheels[0]} and {sdists[0]}")
          PY
