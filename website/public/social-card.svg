    <path d="M180 31H220" stroke="#697587"/><path d="m213 24 8 7-8 7" fill="none" stroke="#697587"/>
    <rect x="230" width="210" height="62" rx="10" fill="#111824" stroke="#3a4453"/><text x="335" y="39" text-anchor="middle" fill="#f4f1ea" font-family="Courier New,monospace" font-size="20" font-weight="700">HTTP API</text>
    <path d="M450 31H490" stroke="#697587"/><path d="m483 24 8 7-8 7" fill="none" stroke="#697587"/>
